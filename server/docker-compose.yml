# Локальна база для розробки: docker compose up -d
# Порт 5433, щоб не конфліктувати з локальним PostgreSQL на 5432.
services:
  postgres:
    image: postgres:17-alpine
    container_name: safetics-postgres
    environment:
      POSTGRES_DB: safetics
      # Власник схеми: під ним працює Flyway. Застосунок ходить під safetics_app (створює міграція V1).
      POSTGRES_USER: safetics_owner
      POSTGRES_PASSWORD: safetics_owner_dev
    ports:
      - "5433:5432"
    volumes:
      - safetics-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetics_owner -d safetics"]
      interval: 5s
      timeout: 3s
      retries: 10

  # База для автотестів інтерфейсу (Playwright, профіль e2e). Окремо від дев-даних, дані в пам'яті:
  # docker compose up -d --wait postgres-e2e  ·  очистити: docker compose rm -sf postgres-e2e
  postgres-e2e:
    image: postgres:17-alpine
    container_name: safetics-postgres-e2e
    profiles: [e2e]
    environment:
      POSTGRES_DB: safetics
      POSTGRES_USER: safetics_owner
      POSTGRES_PASSWORD: safetics_owner_dev
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetics_owner -d safetics"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  safetics-pgdata:
